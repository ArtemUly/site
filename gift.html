<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Подарок · День матери</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>
  <main class="stage">
    <div class="card card--reveal">
      <div class="gift-art">
        <svg viewBox="0 0 220 220" role="img" aria-label="Подарок" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="giftBox" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ff8fb1" />
              <stop offset="1" stop-color="#e0608a" />
            </linearGradient>
            <linearGradient id="giftLid" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffa7c3" />
              <stop offset="1" stop-color="#ea7ba2" />
            </linearGradient>
            <linearGradient id="giftRibbon" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#ffd45e" />
              <stop offset="1" stop-color="#f0a93a" />
            </linearGradient>
          </defs>

          <ellipse cx="110" cy="204" rx="72" ry="12" fill="rgba(95,51,80,0.15)" />

          <rect x="48" y="100" width="124" height="98" rx="12" fill="url(#giftBox)" />
          <rect x="38" y="76" width="144" height="32" rx="10" fill="url(#giftLid)" />
          <rect x="100" y="76" width="20" height="122" fill="url(#giftRibbon)" />

          <ellipse cx="84" cy="62" rx="27" ry="16" fill="url(#giftRibbon)" transform="rotate(-25 84 62)" />
          <ellipse cx="136" cy="62" rx="27" ry="16" fill="url(#giftRibbon)" transform="rotate(25 136 62)" />
          <circle cx="110" cy="72" r="12" fill="#ffd45e" />

          <g fill="#fff" opacity="0.85">
            <path d="M40 40 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3z" />
            <path d="M182 108 l2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4 6.4 -2.4z" />
            <path d="M60 150 l2 5.2 5.2 2 -5.2 2 -2 5.2 -2 -5.2 -5.2 -2 5.2 -2z" />
          </g>
        </svg>
      </div>

      <p class="reveal-text" style="font-family: 'Playfair Display', serif; font-size: 30px; color: #5f3350;">
        Выношу тебе подарок
      </p>
      <a class="btn btn--primary" href="index.html">В начало</a>
    </div>
  </main>
</body>
</html>
