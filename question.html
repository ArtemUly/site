<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вопрос · День матери</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>
  <main class="stage">
    <div class="card">
      <div class="progress">
        <div class="progress__bar">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
        <span class="progress__label" id="progress-label"></span>
      </div>

      <p class="story" id="story"></p>

      <div class="options" id="options"></div>
    </div>
  </main>

  <!-- модальное окно при неверном ответе -->
  <div class="modal" id="modal" hidden>
    <div class="modal__box">
      <div class="modal__emoji" aria-hidden="true">🐶💐</div>
      <p class="modal__text">
        Конечно, ты всегда права, но я задумал другой вариант ответа
      </p>
      <button class="btn btn--primary" id="modal-close" type="button">
        Понятно
      </button>
    </div>
  </div>

  <script src="js/quiz-data.js"></script>
  <script src="js/question.js"></script>
</body>
</html>
