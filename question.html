<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вопрос · День матери</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/quiz.css" />
</head>
<body>
  <main class="stage">
    <div class="card">
      <div class="progress">
        <div class="progress__bar">
          <div class="progress__fill" id="progress-fill"></div>
        </div>
        <span class="progress__label" id="progress-label"></span>
      </div>

      <p class="story" id="story"></p>

      <!-- вариант 1: обычные варианты ответа -->
      <div class="options" id="options"></div>

      <!-- вариант 2: слайдер -->
      <div class="slider-block" id="slider-block" hidden>
        <div class="slider-value" id="slider-value">0</div>
        <input
          class="slider"
          id="slider"
          type="range"
          min="0"
          max="100"
          value="0"
          step="1"
        />
        <div class="slider-ends">
          <span>0</span>
          <span>100</span>
        </div>
      </div>

      <!-- вариант 3: убегающая кнопка -->
      <div class="escape" id="escape-block" hidden>
        <button class="btn btn--primary escape__stay" id="escape-stay" type="button"></button>
        <button class="btn escape__run" id="escape-run" type="button"></button>
      </div>

      <!-- вариант 4: забрось мяч в кольцо -->
      <div class="game" id="game-block" hidden>
        <div class="hoop" id="hoop">
          <div class="hoop__board"></div>
          <div class="hoop__ring" id="hoop-ring"></div>
        </div>
        <div class="ball" id="ball"></div>
      </div>

      <!-- вариант 5: сейф -->
      <div class="safe" id="safe-block" hidden>
        <ul class="safe__hints" id="safe-hints"></ul>
        <div class="safe__device" id="safe-device">
          <div class="safe__inner">
            <button class="btn btn--primary safe__surprise" id="safe-surprise" type="button" hidden>
              Сюрприз
            </button>
          </div>
          <div class="safe__door" id="safe-door">
            <div class="safe__display" id="safe-display">····</div>
            <div class="safe__keys" id="safe-keys"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- модальное окно при неверном ответе -->
  <div class="modal" id="modal" hidden>
    <div class="modal__box">
      <div class="modal__emoji" aria-hidden="true">🐶💐</div>
      <p class="modal__text">
        Конечно, ты всегда права, но я задумал другой вариант ответа
      </p>
      <button class="btn btn--primary" id="modal-close" type="button">
        Понятно
      </button>
    </div>
  </div>

  <script src="js/quiz-data.js"></script>
  <script src="js/question.js"></script>
</body>
</html>
