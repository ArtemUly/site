<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>С Днём матери ❤️</title>
  <meta name="description" content="Маленькая интерактивная викторина для самой лучшей мамы." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="petals" aria-hidden="true"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <main class="app">
    <section id="screen-intro" class="screen screen--active">
      <div class="card card--intro">
        <div class="bouquet" aria-hidden="true">
          <span>🌷</span><span>🌹</span><span>🌸</span>
        </div>
        <p class="eyebrow" id="intro-eyebrow">День матери</p>
        <h1 class="title" id="intro-title">С Днём матери!</h1>
        <p class="subtitle" id="intro-subtitle">
          Маленькая викторина для самого дорогого человека на свете.
        </p>
        <button class="btn btn--primary" id="start-btn">
          Начать викторину
        </button>
        <p class="hint" id="intro-hint">Сколько ты знаешь о нашей семье? 💐</p>
      </div>
    </section>

    <section id="screen-quiz" class="screen">
      <div class="card card--quiz">
        <div class="progress">
          <div class="progress__bar">
            <div class="progress__fill" id="progress-fill"></div>
          </div>
          <span class="progress__label" id="progress-label">Вопрос 1 из 1</span>
        </div>

        <h2 class="question" id="question-text">Вопрос</h2>

        <div class="options" id="options"></div>

        <div class="feedback" id="feedback" hidden></div>

        <button class="btn btn--primary" id="next-btn" disabled>
          Далее
        </button>
      </div>
    </section>

    <section id="screen-result" class="screen">
      <div class="card card--result">
        <div class="score-ring">
          <svg viewBox="0 0 120 120" class="score-ring__svg">
            <circle class="score-ring__track" cx="60" cy="60" r="52" />
            <circle class="score-ring__value" id="score-ring-value" cx="60" cy="60" r="52" />
          </svg>
          <div class="score-ring__text">
            <span id="score-number">0</span>
            <small id="score-total">из 0</small>
          </div>
        </div>

        <h2 class="result-title" id="result-title">Отличный результат!</h2>
        <p class="result-text" id="result-text"></p>

        <div class="result-actions">
          <button class="btn btn--primary" id="restart-btn">
            Пройти ещё раз
          </button>
          <button class="btn btn--ghost" id="share-btn">
            Поделиться
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/quiz-data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
